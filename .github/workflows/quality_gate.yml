name: Q-Task Quality Gate & CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-security-check:
    runs-on: ubuntu-latest
    steps:
    - name: Kodu İndir (Checkout)
      uses: actions/checkout@v4

    - name: Python 3.11 Ortamını Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Bağımlılıkları ve Kalite Araçlarını Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 1. Kalite Kapısı - Kod Standartları (Flake8)
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: 2. Kalite Kapısı - Güvenlik Tarama (Bandit SAST)
      run: |
        bandit -r src/ -ll

    - name: 3. Kalite Kapısı - McCabe Karmaşıklık Analizi (Radon)
      run: |
        radon cc src/ -a -s

    - name: 4. Kalite Kapısı - Birim Testler ve Kapsama (Pytest)
      run: |
        PYTHONPATH=. pytest --cov=src tests/
