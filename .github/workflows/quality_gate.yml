name: Q-Task Quality Gate & CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Indir (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.11 Ortamini Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari ve Kalite Araclarini Yukle
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov radon flake8 bandit

      - name: 1. Kalite Kapisi - Kod Standartlari (Flake8)
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 2. Kalite Kapisi - Guvenlik Tarama (Bandit SAST)
        run: |
          bandit -r src/ -ll

      - name: 3. Kalite Kapisi - McCabe Karmasiklik Analizi (Radon)
        run: |
          radon cc src/ -a -s

      - name: 4. Kalite Kapisi - Birim Testler ve Kapsama (Pytest)
        run: |
          PYTHONPATH=. pytest --cov=src tests/
